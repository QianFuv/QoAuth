name: Reusable Go Checks

on:
  workflow_call:
    inputs:
      web_artifact_id:
        description: Immutable tested frontend artifact from this run
        required: true
        type: string

permissions:
  contents: read

jobs:
  checks:
    name: Go ${{ matrix.lane }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
        lane: [regular, race]
    env:
      GOTOOLCHAIN: local
      GOMAXPROCS: '2'
      GOFLAGS: -p=2
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.10
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
      - name: Download tested frontend bytes
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ inputs.web_artifact_id }}
          path: .cache/tested-web
          merge-multiple: true
      - name: Verify and import exact frontend
        run: node scripts/release.mjs import-web .cache/tested-web
      - name: Verify native compiler
        if: matrix.lane == 'race'
        run: gcc --version
      - name: Run complete regular lane
        shell: bash
        id: regular
        if: matrix.lane == 'regular'
        run: |
          go test -timeout 180s ./cmd/... ./internal/... ./examples/...
          go vet ./cmd/... ./internal/... ./examples/...
      - name: Run complete race lane
        id: race
        if: matrix.lane == 'race'
        env:
          CGO_ENABLED: '1'
        run: go test -timeout 180s -race ./cmd/... ./internal/... ./examples/...
      - name: Report quality summary
        if: always()
        env:
          CI_STAGE: quality
          CI_PLATFORM: ${{ runner.os }}/${{ runner.arch }}/${{ matrix.lane }}
          CI_STATUS: ${{ job.status }}
          CI_CHECKS: ${{ toJSON(steps) }}
          CI_REPORT_FILE: .cache/backend-ci.json
        run: node scripts/ci-report.mjs
      - name: Upload sanitized backend diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-${{ matrix.os }}-${{ matrix.lane }}
          path: .cache/backend-ci.json
          if-no-files-found: warn
          retention-days: 14
